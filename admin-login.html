<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#102a54">
    <title>Admin Portal | PC Repair Hub</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-portal-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            box-sizing: border-box;
            padding: 28px 18px;
            background: radial-gradient(ellipse at 15% 10%, #e2edff 0, transparent 42%),
                linear-gradient(145deg, #f6f8fc, #eaf0fa);
        }
        .admin-portal-card {
            width: min(100%, 460px);
            box-sizing: border-box;
            padding: clamp(26px, 6vw, 44px);
            border: 1px solid rgba(205, 217, 236, .9);
            border-radius: 22px;
            background: #fff;
            box-shadow: 0 24px 70px rgba(17, 42, 82, .16);
        }
        .admin-portal-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
        .admin-portal-brand img { width: 48px; height: 48px; object-fit: contain; }
        .admin-portal-brand span { color: #183967; font-weight: 800; }
        .admin-portal-icon {
            display: grid;
            width: 64px;
            height: 64px;
            place-items: center;
            margin-bottom: 20px;
            border-radius: 18px;
            background: #eaf1ff;
            color: #2257a2;
        }
        .admin-portal-icon svg { width: 34px; height: 34px; }
        .admin-portal-eyebrow { margin: 0 0 8px; color: #53709a; font-size: .78rem; font-weight: 800; letter-spacing: .14em; }
        .admin-portal-card h1 { margin: 0; color: #162b4d; font-size: clamp(1.7rem, 7vw, 2.2rem); }
        .admin-portal-description { margin: 10px 0 26px; color: #61718a; line-height: 1.65; }
        .admin-portal-submit {
            width: 100%;
            min-height: 52px;
            margin-top: 18px;
            border: 0;
            border-radius: 11px;
            background: linear-gradient(120deg, #173e78, #2864b5);
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
        .admin-portal-submit:disabled { opacity: .65; cursor: wait; }
        .admin-portal-submit:hover { filter: brightness(1.07); }
        .admin-portal-error { margin: 14px 0 0; color: #b42318; font-weight: 700; line-height: 1.5; }
        .admin-portal-error[hidden] { display: none; }
        .admin-portal-error.is-success { color: #167044; }
        .admin-portal-back { display: inline-block; margin-top: 24px; color: #315a91; font-weight: 700; text-decoration: none; }
        .admin-portal-back:hover { text-decoration: underline; }
    </style>
</head>
<body class="admin-portal-page">
    <main class="admin-portal-card">
        <div class="admin-portal-brand">
            <img src="images/logo.png" alt="">
            <span>PC Repair Hub</span>
        </div>
        <div class="admin-portal-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 3 20 6v5c0 5-3.4 8.2-8 10-4.6-1.8-8-5-8-10V6l8-3Z"/>
                <rect x="9" y="10" width="6" height="5" rx="1"/>
                <path d="M10.5 10V8.5a1.5 1.5 0 0 1 3 0V10"/>
            </svg>
        </div>
        <p class="admin-portal-eyebrow">PC REPAIR HUB · ADMINISTRATION</p>
        <h1>Admin Portal</h1>
        <p class="admin-portal-description">เข้าสู่ระบบด้วยบัญชี Google ที่เจ้าของโปรเจกต์กำหนดสิทธิ์ไว้</p>
        <form id="adminPortalForm" class="admin-portal-form" novalidate>
            <button id="adminGoogleSignIn" class="admin-portal-submit" type="submit">เข้าสู่ระบบด้วย Google</button>
            <p id="adminPortalError" class="admin-portal-error" role="alert" aria-live="polite" hidden></p>
        </form>
        <a class="admin-portal-back" href="login.html">← กลับหน้าเข้าสู่ระบบ</a>
    </main>
    <script type="module" src="admin-login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">

    <link rel="stylesheet" href="style.css">
    <script src="admin-panel.js" defer></script>
</head>
<body class="admin-panel-page" data-admin-panel>
    <header class="main-navbar admin-panel-navbar">
        <a class="main-logo" href="index.html">
            <img src="images/logo.png" alt="PC Repair Hub">
            <span>PC Repair Hub</span>
        </a>
        <a class="admin-back-link" href="admin-dashboard.html">← กลับหน้า Admin Dashboard</a>

    <main class="admin-panel-container">
        <div class="admin-panel-heading">
